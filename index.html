<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="一个简单、轻巧的个人网页。">
  <title>你好，世界 · 我的网页</title>
  <style>
    :root{color-scheme:light;--bg:#f6f4ee;--text:#182a27;--muted:#5b6b65;--accent:#28614e;--line:#d9dfd6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
    a{color:inherit}header,main,footer{max-width:1060px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font-weight:700;text-decoration:none}.mark{display:inline-block;margin-right:9px;color:var(--accent)}nav a{font-size:14px;color:var(--muted);text-decoration:none}
    main{padding-top:100px;padding-bottom:100px}.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--accent)}h1{font-size:clamp(46px,8vw,84px);line-height:1.15;letter-spacing:-.05em;margin:24px 0}h1 span{color:var(--accent)}
    .intro{font-size:18px;line-height:1.9;max-width:570px;color:var(--muted)}.actions{display:flex;gap:16px;align-items:center;margin:32px 0 70px}button{border:0;background:var(--accent);color:white;border-radius:8px;padding:15px 24px;font-size:15px;cursor:pointer}button:hover{filter:brightness(1.12)}a:focus-visible,button:focus-visible{outline:3px solid #c18e3b;outline-offset:5px}
    #message{color:var(--accent);min-height:24px;font-size:14px}.about{border-top:1px solid var(--line);padding-top:30px;display:grid;grid-template-columns:1fr 2fr;gap:36px}.about h2{font-size:20px;margin:0}.about p{margin:0;line-height:1.9;color:var(--muted)}
    footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}@media(max-width:600px){header,main,footer{padding:22px}main{padding-top:64px;padding-bottom:60px}.actions{align-items:flex-start;flex-direction:column;margin-bottom:48px}.about{grid-template-columns:1fr;gap:16px}footer{flex-direction:column}}
  </style>
</head>
<body>
  <header><a class="brand" href="./"><span class="mark" aria-hidden="true">◈</span>我的网页</a><nav><a href="#about">关于这个页面 ↗</a></nav></header>
  <main>
    <p class="eyebrow">HELLO, WORLD</p>
    <h1>从一个页面，<br><span>开始新的可能。</span></h1>
    <p class="intro">欢迎来到我的小小网页。这里是一个起点，未来可以用来分享想法、记录生活，或展示正在创造的东西。</p>
    <div class="actions"><button type="button" id="hello">打个招呼 <span aria-hidden="true">↗</span></button><span id="message" role="status" aria-live="polite"></span></div>
    <section class="about" id="about"><h2>简单，也很有用。</h2><p>一个轻巧的页面，适配电脑和手机。没有复杂的界面，只有清楚的文字和一点好奇心。欢迎你来看看。</p></section>
  </main>
  <footer><span>我的网页 · <span id="year">2026</span></span><span>保持好奇，继续创造。</span></footer>
  <script>document.getElementById('year').textContent=new Date().getFullYear();document.getElementById('hello').addEventListener('click',()=>{document.getElementById('message').textContent='你好！很高兴在这里遇见你。';});</script>
</body>
</html>
